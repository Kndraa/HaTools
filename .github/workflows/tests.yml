# Compiles the package in Unity and runs its Edit Mode tests. Full docs: CLAUDE.md > Testing.
name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.md.meta'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: Edit Mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets are required. See CLAUDE.md > Testing."
            exit 1
          fi

      # The package goes in package/, next to a throwaway Unity project that references it
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Create test project
        run: cp -r package/.github/test-project TestProject

      - uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: Library-${{ hashFiles('package/**/*.cs', 'package/**/*.asmdef', 'package/.github/test-project/**') }}
          restore-keys: Library-

      - name: Run tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject
          testMode: editmode
          githubToken: ${{ github.token }}
          checkName: Edit Mode test results

      - uses: actions/upload-artifact@v4
        if: always() && steps.tests.outcome != 'skipped'
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

      # Unity writes a .meta for every file it imports; any new one here was never committed
      - name: Check for missing .meta files
        if: always() && steps.tests.outcome != 'skipped'
        working-directory: package
        run: |
          missing=$(git -c safe.directory='*' ls-files --others --exclude-standard -- '*.meta')
          if [ -n "$missing" ]; then
            echo "::error::Unity generated .meta files that are not committed. Commit these files (contents below):"
            echo "$missing" | while IFS= read -r f; do echo "----- $f"; cat "$f"; done
            exit 1
          fi
          echo "All .meta files are committed."
